# Единая ротация логов: stream-режим collector'а и воркеры notifier
# на демо-прогоне могут надуть логи до гигабайт.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-app}"
      POSTGRES_DB: "${POSTGRES_DB:-realestate}"
    ports:
      # 127.0.0.1 — база нужна на хосте только для отладки, наружу в LAN
      # её не светим; сервисы ходят через docker-сеть.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ — переменные вычисляются внутри контейнера, а не compose-интерполяцией.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *default-logging
    # contracts.md §2: volume, AOF appendfsync everysec, noeviction —
    # необработанные события стрима не теряются и не вытесняются.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      # 127.0.0.1 — как у postgres: отладка с хоста, без доступа из LAN.
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build: ./core-api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8000:8000"
    environment:
      # Данные для подключения передаются отдельными переменными:
      # core-api сам собирает адрес и экранирует спецсимволы пароля,
      # поэтому знак @ и другие в POSTGRES_PASSWORD не ломают URL.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-app}"
      POSTGRES_DB: "${POSTGRES_DB:-realestate}"
      REDIS_URL: redis://redis:6379/0
      CORE_API_LOG_LEVEL: "${CORE_API_LOG_LEVEL:-INFO}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # В образе python-slim нет wget/curl — проверяем /health/ready
    # средствами python. Эндпоинт отвечает 200, только когда доступны
    # Postgres и Redis, иначе 503 (urlopen падает — контейнер unhealthy).
    # Так «healthy» означает полную готовность, а не живой процесс,
    # что важно для depends_on у collector и notifier.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  collector:
    build: ./collector
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8001:8001"
    environment:
      CORE_API_URL: http://core-api:8000
      REDIS_URL: redis://redis:6379/0
      MOCK_MODE: "true"
    depends_on:
      core-api:
        condition: service_healthy
    # TODO(#17): healthcheck добавим вместе с реализацией collector
    # (сейчас в образе только Dockerfile-заглушка — проверять нечего).

  notifier:
    build: ./notifier
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      # notifier работает с Postgres: SQL-миграции каталога
      # notifier/migrations/ (сейчас 0001, 0002) применяются встроенным
      # раннером при старте. БД недоступна на старте —
      # сервис завершается с ошибкой (fail-fast); POSTGRES_* не заданы —
      # memory-режим (в логе "DB disabled"). Данные передаются отдельными
      # переменными, чтобы спецсимволы пароля не ломали подключение.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-app}"
      POSTGRES_DB: "${POSTGRES_DB:-realestate}"
      # Пустое значение допустимо: dsnFromEnv считает незаданный sslmode
      # пустым и подставляет дефолт disable (notifier/internal/db/db.go).
      POSTGRES_SSLMODE: "${POSTGRES_SSLMODE:-}"
      CORE_API_URL: http://core-api:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ADMIN_KEY: ${ADMIN_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # notifier ходит в справочники Core API — ждём его готовности.
      core-api:
        condition: service_healthy
    # alpine содержит busybox wget. /health/ready отвечает 200 только при
    # живых redis + dicts + db, иначе 503 → wget падает → контейнер
    # unhealthy: «healthy» означает готовность, а не живость процесса.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Резервное копирование по расписанию (карточка 06 плана prod-10of10,
  # ТЗ 6.1): postgres:16-контейнер с pg_dump/initdb внутри — ходит в
  # postgres по compose-сети, без docker-сокета. Ежедневный дамп в BACKUP_AT
  # (TZ Europe/Minsk по ТЗ 3.2) + манифест; retention 7 daily + 4 weekly;
  # по BACKUP_VERIFY_DAY — восстановление последнего дампа во временный
  # кластер внутри контейнера со сверкой строк (контейнерная версия
  # scripts/db/restore-verify.sh). Маркеры .last-success/.last-verify в
  # volume — основа алерта «бэкап старше 26 часов» (docs/db-backup-restore.md).
  db-backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_USER: ${POSTGRES_USER:-app}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-app}
      PG_DB: ${POSTGRES_DB:-realestate}
      PG_HOST: postgres
      PG_PORT: "5432"
      BACKUP_DIR: /backups
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_VERIFY_DAY: ${BACKUP_VERIFY_DAY:-7}
      BACKUP_ON_START: ${BACKUP_ON_START:-1}
      # Ретеншн дампов: сколько последних дневных и weekly-копий хранить
      # (прокидывается из .env; дефолты совпадают с шапкой backup-loop.sh)
      RETENTION_DAILY: ${RETENTION_DAILY:-7}
      RETENTION_WEEKLY: ${RETENTION_WEEKLY:-4}
      TZ: Europe/Minsk
    volumes:
      - backups:/backups
      # Скрипт ro: расписание не должно редактироваться изнутри контейнера
      # (тот же приём, что у сервисных ролей в db-roles-setup).
      - ./scripts/db/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ["bash", "/usr/local/bin/backup-loop.sh"]
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  backups:
