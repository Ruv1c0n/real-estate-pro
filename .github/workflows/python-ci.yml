# .github/workflows/python-ci.yml
# Проверки Python-сервисов (core-api, collector).
# Ручной запуск для проверки: вкладка Actions → python-ci → Run workflow.
name: python-ci
on:
  pull_request:
    paths:
      - core-api/**
      - collector/**
      - .github/workflows/python-ci.yml
  push:
    branches:
      - main
      - feature/core-api-foundation
      - "task/core-api-*"
    paths:
      - core-api/**
      - collector/**
      - .github/workflows/python-ci.yml
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core-api, collector]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.17.3"
      - name: ruff check (линтер)
        run: ruff check ${{ matrix.service }}
      - name: ruff format --check (форматирование)
        run: ruff format --check ${{ matrix.service }}

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core-api, collector]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Используем зависимости разработки, если файл существует.
      # Для сервисов без тестов пропускаем запуск pytest.
      - name: pytest (если есть тесты)
        run: |
          svc="${{ matrix.service }}"

          if find "$svc" -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            if [ -f "$svc/requirements-dev.txt" ]; then
              python -m pip install -r "$svc/requirements-dev.txt"
            else
              if [ -f "$svc/requirements.txt" ]; then
                python -m pip install -r "$svc/requirements.txt"
              fi
              python -m pip install pytest
            fi

            python -m pip check
            cd "$svc"
            python -m pytest -v
          else
            echo "В $svc тестов пока нет — шаг пропущен"
          fi
