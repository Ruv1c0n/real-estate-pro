name: collector-ui
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  collector-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build ./collector
      - run: docker build ./ui
      - run: docker compose -f dev/docker-compose.dev.yml config -q
