# .github/workflows/migrations.yml
# Smoke-проверка миграций: накат SQL-миграций notifier с нуля на чистой Postgres.
# Миграции готовит Илья, применение при деплое — зона Даниила; эта проверка ловит
# ошибки в SQL до деплоя.
# Каталог миграций: notifier/migrations/*.sql (если Илья выберет другой путь —
# поправить paths ниже и команду в шаге).
# Джоба alembic гоняет миграции схемы core (alembic.ini появился в main с PR #81).
# Alembic идёт из core-api/requirements.txt — отдельный шаг установки не нужен.
name: migrations
on:
  pull_request:
    paths:
      - notifier/migrations/**
      - core-api/alembic.ini
      - core-api/alembic/**
      - core-api/requirements.txt
      - .github/workflows/migrations.yml
  push:
    branches: [main]
    paths:
      - notifier/migrations/**
      - core-api/alembic.ini
      - core-api/alembic/**
      - core-api/requirements.txt
  workflow_dispatch:

jobs:
  notifier-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: realestate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d realestate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Накатить SQL-миграции notifier на чистую базу
        run: |
          set -euo pipefail
          if ! ls notifier/migrations/*.sql >/dev/null 2>&1; then
            echo "notifier/migrations пуст — миграций пока нет, пропуск"
            exit 0
          fi
          for f in $(ls notifier/migrations/*.sql | sort); do
            echo "== применяю $f"
            PGPASSWORD=app psql -h localhost -U app -d realestate -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "Все миграции применены успешно"

  # Alembic-миграции схемы core. DSN явно не задаётся: config.py собирает
  # asyncpg-DSN из POSTGRES_* (app/app@127.0.0.1:5432/realestate) — ровно
  # реквизиты сервиса postgres ниже.
  alembic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: realestate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d realestate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Зависимости core-api
        run: python -m pip install -r core-api/requirements.txt
      - name: alembic upgrade head (миграции схемы core)
        working-directory: core-api
        run: alembic upgrade head

  # Полный цикл миграций + роли per-service (0002) на изолированном кластере:
  # тест сам создаёт одноразовую базу, гоняет upgrade/downgrade/upgrade и
  # проверяет состав схемы, версию, роли и изоляцию схем (ТЗ 6.1, 6.5).
  # Отдельная джоба с чистым кластером обязательна: DROP ROLE в downgrade
  # блокируют гранты ролей в любой другой базе кластера, а в джобе alembic
  # выше роли уже получают права на realestate.
  alembic-full-cycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: realestate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d realestate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Зависимости core-api (с pytest)
        run: python -m pip install -r core-api/requirements-dev.txt
      - name: Полный цикл миграций и роли per-service
        env:
          # DSN администратора изолированного service-контейнера;
          # тест подключается к служебной базе postgres
          MIGRATION_TEST_DSN: postgresql://app:app@127.0.0.1:5432/postgres
        run: python -m pytest core-api/tests/test_migrations.py -v
