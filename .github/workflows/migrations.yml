# .github/workflows/migrations.yml
# Smoke-проверка миграций: накат SQL-миграций notifier с нуля на чистой Postgres.
# Миграции готовит Илья, применение при деплое — зона Даниила; эта проверка ловит
# ошибки в SQL до деплоя.
# Каталог миграций: notifier/migrations/*.sql (если Илья выберет другой путь —
# поправить paths ниже и команду в шаге).
# Джоба alembic ниже активируется автоматически, как только в репо появится
# alembic.ini (пока его нет — job в UI вообще не создаётся, это чисто).
name: migrations
on:
  pull_request:
    paths:
      - notifier/migrations/**
      - .github/workflows/migrations.yml
  push:
    branches: [main]
    paths:
      - notifier/migrations/**
  workflow_dispatch:

jobs:
  notifier-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: realestate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d realestate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Накатить SQL-миграции notifier на чистую базу
        run: |
          set -euo pipefail
          if ! ls notifier/migrations/*.sql >/dev/null 2>&1; then
            echo "notifier/migrations пуст — миграций пока нет, пропуск"
            exit 0
          fi
          for f in $(ls notifier/migrations/*.sql | sort); do
            echo "== применяю $f"
            PGPASSWORD=app psql -h localhost -U app -d realestate -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "Все миграции применены успешно"

  # Авто-job для Alembic-миграций core (задел под Тимура/Илью, никого не блокирует):
  # пока alembic.ini в репо нет, условие if не проходит и job в UI не видна вообще.
  # Как только Тимур добавит alembic.ini (например, core-api/alembic.ini) — job
  # появится сам, отдельные правки workflow не нужны.
  alembic:
    if: ${{ hashFiles('**/alembic.ini') != '' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: realestate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d realestate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Зависимости core-api
        run: python -m pip install -r core-api/requirements.txt
      # alembic пока не запинен в core-api/requirements.txt — ставим отдельным шагом
      # (убрать, когда Тимур запинит alembic в requirements)
      - name: Установить alembic
        run: python -m pip install alembic
      - name: alembic upgrade head (миграции схемы core)
        working-directory: core-api
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@127.0.0.1:5432/realestate
        run: alembic upgrade head
