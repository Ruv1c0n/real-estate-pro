# .github/workflows/docs-links.yml
# Проверка относительных ссылок в markdown: ловит ссылки на переименованные
# или несуществующие файлы (например, docs/TZ.pdf вместо Real_Estate_Pro_TZ.pdf).
# Внешние (http/https) ссылки намеренно не проверяются.
name: docs-links
on:
  pull_request:
    paths:
      - "**/*.md"
      - .github/workflows/docs-links.yml
      - .github/scripts/check-md-links.sh
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - .github/scripts/check-md-links.sh
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить относительные ссылки в .md
        run: |
          out=$(bash .github/scripts/check-md-links.sh)
          if [ -n "$out" ]; then
            echo "Найдены битые ссылки:"
            echo "$out"
            exit 1
          fi
          echo "Битых относительных ссылок нет"
