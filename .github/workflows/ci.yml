# .github/workflows/ci.yml
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  notifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifier
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: notifier/go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "не отформатировано:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test ./... -race

  # Правило ТЗ 6.5: секреты только через .env — ловим случайные коммиты токенов
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Ловит ошибки docker-compose/Dockerfile до деплоя (зона сквозной интеграции)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: docker compose config -q
      - name: docker compose build
        run: docker compose build
