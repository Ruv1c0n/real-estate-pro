# .github/dependabot.yml
# Еженедельные обновления зависимостей; PR от Dependabot проходят тот же CI
version: 2
updates:
  - package-ecosystem: gomod
    directory: /notifier
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(notifier)"
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /notifier
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(notifier)"
    labels: [dependencies]

  # заглушка core-api: пока образ тривиальный, обновления редкие
  - package-ecosystem: docker
    directory: /core-api
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(core-api)"
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /collector
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(collector)"
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /collector
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(collector)"
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /ui
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ui)"
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ui)"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies]
