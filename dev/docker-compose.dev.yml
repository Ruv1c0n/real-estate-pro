# Локальная проверка collector + ui без настоящего Core API:
#   docker compose -f dev/docker-compose.dev.yml up --build
# UI: http://localhost:8080   Заглушка API: http://localhost:8000/docs
services:
  fake-core-api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 3s
      timeout: 3s
      retries: 15

  collector:
    build: ../collector
    environment:
      MOCK_MODE: "true"
      CORE_API_URL: http://fake-core-api:8000
      MOCK_DATA_PATH: /srv/data/listings.json
      COLLECT_INTERVAL_SEC: "300"
    depends_on:
      fake-core-api:
        condition: service_healthy

  ui:
    build: ../ui
    environment:
      CORE_API_URL: http://fake-core-api:8000
    ports:
      - "8080:8080"
    depends_on:
      fake-core-api:
        condition: service_healthy
