# Alembic для схемы core. Запуск: alembic upgrade head (из каталога core-api).
# URL подключения берётся из app.config.Settings (DATABASE_URL либо сборка
# из POSTGRES_*), в alembic.ini не задаётся и секретов здесь нет.
[alembic]
script_location = alembic
prepend_sys_path = .
# имена файлов версий: 0001_core_schema.py — ревизию и slug задаём вручную
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
